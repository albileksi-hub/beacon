name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Both the version the project has always run on and the one the Docker
    # image ships. Shipping an image on a Python the suite never exercises is
    # worse than either choice on its own.
    name: Lint and test (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=100

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest

    # The reporting SQL differs between dialects -- date truncation has nothing
    # in common between the two -- so the whole suite runs again for real
    # against the database production actually uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      BEACON_TEST_DATABASE_URL: postgresql+psycopg://beacon:beacon@localhost:5432/beacon_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Test
        run: pytest

  migrations:
    name: Migrations match the models
    runs-on: ubuntu-latest
    env:
      BEACON_DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Fail if a model change has no migration
        run: alembic check

      - name: Check the migration reverses
        run: alembic downgrade base

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t beacon:ci .

      - name: Start it against a throwaway SQLite database
        run: |
          docker run -d --name beacon-ci -p 8000:8000 \
            -e BEACON_DATABASE_URL=sqlite:////tmp/ci.db \
            -e BEACON_SESSION_SECRET=ci-only-secret \
            beacon:ci

      - name: Wait for the health check to pass
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy"
          docker logs beacon-ci
          exit 1
