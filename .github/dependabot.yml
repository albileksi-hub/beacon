# Nobody was watching the dependencies. Twelve floors and no lockfile meant a
# compromised release upstream would have arrived on the next build, silently,
# on every self-hosted instance that rebuilt.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Raised from 5, which the routine dev-tool bumps had filled. Dependabot
    # stops opening pull requests at the limit, so four advisories against the
    # locked runtime -- three in urllib3, one in multidict -- had nowhere to
    # arrive while ruff, pytest, mypy, hypothesis and pip-tools held every slot.
    # A cap that lets housekeeping crowd out security fixes is the wrong cap.
    open-pull-requests-limit: 10
    # pydantic-core and psycopg-binary used to be ignored here, because their
    # parents pin them with `==` and bumping one alone produces a lock that
    # cannot import the other -- pydantic-core went to 2.48.0 while pydantic
    # stayed at 2.13.5 and the image build died with
    #
    #   SystemError: The installed pydantic-core version (2.48.0) is
    #   incompatible with the current pydantic version, which requires 2.46.5
    #
    # Ignoring them fixed the standalone bump and broke the paired one. An
    # ignored dependency is also left out of the group below, so the group
    # moved psycopg to 3.3.6 while psycopg-binary stayed at 3.3.5, the install
    # became unresolvable, and it blocked the one pull request carrying four
    # advisory fixes. The same mismatch, arriving the other way round.
    #
    # Grouping gets the parent and the child into one pull request, which is
    # the only way either of them installs, and it is the right answer for
    # psycopg: the two halves are released as a matched set, so there is always
    # a parent to travel with.
    #
    # It does not close the window for pydantic, and the claim that it did was
    # wrong. pydantic-core is published ahead of the pydantic that pins it --
    # 2.49.0 on 9 September, the first pydantic wanting it on 8 October -- so
    # for a month the group found a child to move and no parent, bumped
    # pydantic-core alone, and produced a lock that cannot be installed. Five
    # of six jobs on that pull request failed, including the one carrying the
    # urllib3 advisory fixes.
    #
    # Ignoring pydantic-core is not the fix either; it only mirrors the break,
    # leaving the child behind when the parent moves. Neither setting can help,
    # because the premise is wrong: this file is a resolution, and a resolution
    # cannot be edited one line at a time by anything. So Dependabot proposes
    # here, and the lock is produced whole by the Relock workflow, on Linux,
    # where it is actually installable. An incoherent proposal now fails with
    # instructions rather than a pip resolution dump.
    groups:
      # One PR for the routine bumps; anything that needs reading arrives alone.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
