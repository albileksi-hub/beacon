# Nobody was watching the dependencies. Twelve floors and no lockfile meant a
# compromised release upstream would have arrived on the next build, silently,
# on every self-hosted instance that rebuilt.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Raised from 5, which the routine dev-tool bumps had filled. Dependabot
    # stops opening pull requests at the limit, so four advisories against the
    # locked runtime -- three in urllib3, one in multidict -- had nowhere to
    # arrive while ruff, pytest, mypy, hypothesis and pip-tools held every slot.
    # A cap that lets housekeeping crowd out security fixes is the wrong cap.
    open-pull-requests-limit: 10
    ignore:
      # These two are not independently upgradable. Their parents pin them with
      # `==`, so Dependabot bumping one on its own produces a lock that cannot
      # import the parent -- which is what happened: pydantic-core went to
      # 2.48.0 while pydantic stayed at 2.13.5, and the image build died with
      #
      #   SystemError: The installed pydantic-core version (2.48.0) is
      #   incompatible with the current pydantic version, which requires 2.46.5
      #
      # Only the Docker job noticed, because it is the only one installing from
      # the hash-pinned lock; the rest resolve from pyproject and quietly pick
      # a compatible pair. The right version of each is whatever the parent
      # asks for, and pip-compile fills that in when the parent moves.
      - dependency-name: pydantic-core
      - dependency-name: psycopg-binary
    groups:
      # One PR for the routine bumps; anything that needs reading arrives alone.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
