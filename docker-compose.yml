# A production-shaped stack for local use: Postgres instead of SQLite, the app
# behind the same image that gets deployed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    volumes:
      - beacon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@db:5432/beacon
      # No default on purpose. A placeholder here is a constant in a public
      # repository that every copy of this stack would share, and it slipped
      # past the application's own guard because that only knew the one
      # built-in string. `:?` makes compose refuse to start instead.
      #   export BEACON_SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
      BEACON_SESSION_SECRET: "${BEACON_SESSION_SECRET:?set it first - see the comment above}"
      BEACON_ROLLUP_INTERVAL_SECONDS: 60
      # Enable once there is TLS in front of the app.
      BEACON_SESSION_HTTPS_ONLY: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  beacon-db:
