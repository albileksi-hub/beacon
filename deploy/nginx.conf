# Rate limiting for the one endpoint that is open to the whole internet.
#
# The application deliberately does not do this itself. A table-backed limiter
# would mean a database write per pageview in order to count pageviews, and an
# in-process counter is per-worker -- so the real ceiling becomes the limit
# times the process count, it grows in memory unless entries are evicted, and
# it resets on deploy. A proxy sees every worker, holds the state outside the
# processes, and rejects before Python is reached.

limit_req_zone $binary_remote_addr zone=collect:10m rate=20r/s;

upstream beacon {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # The collector accepts one event per page read, so a single visitor is
    # nowhere near this. It is set to catch a flood, not to shape ordinary
    # traffic. A large office behind one address is the case that would feel
    # it -- raise the rate rather than remove the zone.
    location = /api/event {
        limit_req zone=collect burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://beacon;
        include /etc/nginx/conf.d/forwarded.inc;
    }

    location / {
        proxy_pass http://beacon;
        include /etc/nginx/conf.d/forwarded.inc;
    }
}
