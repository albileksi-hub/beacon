[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
description = "Privacy-first, cookieless web analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "user-agents>=2.2",
    "geoip2>=4.8",
    "psycopg[binary]>=3.1",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # Only for the test that parses docker-compose.yml. It was importable
    # anyway as somebody else's transitive dependency, which is not the same
    # as being available.
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by Alembic and rewritten on every revision. env.py is ours
# and stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

# The only dependency that ships no type information. Scoped to that one
# package rather than waived globally, so a future untyped import is noticed.
[[tool.mypy.overrides]]
module = ["user_agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
