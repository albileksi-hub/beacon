[build-system]
# 77 is where PEP 639 license expressions land; 84 is what Dependabot asked
# for, and it is a superset of that.
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
description = "Privacy-first, cookieless web analytics"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "user-agents>=2.2",
    "geoip2>=4.8",
    "psycopg[binary]>=3.1",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.5",
    "mypy>=1.11",
    # Only for the test that parses docker-compose.yml. It was importable
    # anyway as somebody else's transitive dependency, which is not the same
    # as being available.
    "pyyaml>=6",
    # Supply chain. pip-audit checks the locked versions against the advisory
    # database; pip-tools regenerates the lock from pyproject.
    "pip-audit>=2.10.1",
    "pip-tools>=7.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by Alembic and rewritten on every revision. env.py is ours
# and stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

# The only dependency that ships no type information. Scoped to that one
# package rather than waived globally, so a future untyped import is noticed.
[[tool.mypy.overrides]]
module = ["user_agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
# Branch coverage, not only statement coverage. The gate read 100% while five
# conditions across four modules had only ever been taken one way: a trusted
# proxy that sends no header, a relay wanting neither TLS nor a login, a
# username with no password, and an already-aware expiry -- which is the shape
# Postgres returns and SQLite never does, and the gate runs on SQLite.
#
# Set here rather than in the CI command, so the number reported locally is the
# number the build enforces. A coverage figure that means something different
# depending on where it is measured is worse than no figure.
branch = true
